<template>
    <lightning-card title="Detalle de Incidencia" icon-name="standard:record">
        <template if:true={incidencia}>
            <div class="slds-m-around_medium">

                <p><strong>Título:</strong> {incidencia.Titulo__c}</p>
                <p><strong>Descripción:</strong> {incidencia.Descripcion__c}</p>

                <div class="slds-m-vertical_small">
                    <p><strong>Estado:</strong> {incidencia.Estado__c}</p>

                    <lightning-button 
                        label="Cambiar Estado"
                        variant="brand-outline"
                        onclick={openEstadoModal}>
                    </lightning-button>
                </div>

                <div class="slds-m-vertical_small">
                    <p><strong>Prioridad:</strong> {incidencia.Prioridad__c}</p>

                    <lightning-button 
                        label="Cambiar Prioridad"
                        variant="brand-outline"
                        onclick={openPrioridadModal}>
                    </lightning-button>
                </div>

                <p><strong>Fecha de creación:</strong> {incidencia.Fecha_Creacion__c}</p>

                <template if:true={incidencia.Usuario__r}>
                    <p><strong>Usuario:</strong> {incidencia.Usuario__r.Name}</p>
                </template>
                <template if:false={incidencia.Usuario__r}>
                    <p><strong>Usuario:</strong> —</p>
                </template>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Cerrar Incidencia"
                        variant="destructive"
                        onclick={handleCerrarIncidencia}>
                    </lightning-button>
                </div>

            </div>

            <hr class="slds-m-vertical_small" />

            <div class="slds-m-around_medium">
                <h2 class="slds-text-heading_small">Comentarios</h2>
                <c-comentarios-list incidencia-id={recordId}></c-comentarios-list>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-m-around_medium">Error al cargar la incidencia</div>
        </template>
    </lightning-card>


    <template if:true={showEstadoModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Cambiar Estado</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-combobox
                        name="estado"
                        label="Nuevo Estado"
                        value={nuevoEstado}
                        placeholder="Selecciona Estado"
                        options={estadoOptions}
                        onchange={handleEstadoChange}>
                    </lightning-combobox>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancelar" onclick={closeEstadoModal}></lightning-button>
                    <lightning-button label="Guardar" variant="brand" onclick={guardarEstado}></lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>


    <template if:true={showPrioridadModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Cambiar Prioridad</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-combobox
                        name="prioridad"
                        label="Nueva Prioridad"
                        value={nuevaPrioridad}
                        placeholder="Selecciona Prioridad"
                        options={prioridadOptions}
                        onchange={handlePrioridadChange}>
                    </lightning-combobox>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancelar" onclick={closePrioridadModal}></lightning-button>
                    <lightning-button label="Guardar" variant="brand" onclick={guardarPrioridad}></lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
