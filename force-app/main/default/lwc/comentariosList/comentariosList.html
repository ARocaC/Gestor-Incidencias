<template>
    <template if:true={comentarios}>
        <template for:each={comentarios} for:item="com">
            <div key={com.Id} class="slds-box slds-m-bottom_small">
                <p><b>{com.Usuario__r.Name}</b></p>
                <p>{com.Texto__c}</p>
                <p class="slds-text-color_weak slds-text-body_small">
                    {com.Fecha__c}
                </p>
            </div>
        </template>
    </template>

    <template if:true={error}>
        <p>Error: {error}</p>
    </template>
</template>
